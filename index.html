
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NDOORE</title>
  <meta name="description" content="Venanzio Mwangi Ndoore is a Kenyan songwriter and the founder of BBO Records. He raps as Vena Huncho and Mofarity, and makes beats as BBO Beats.">
  <meta name="theme-color" content="#000000">

  <!-- FAVICON -->
  <link rel="icon" href="ndoore-favicon-updated.ico" sizes="any">
  <link rel="icon" type="image/png" href="ndoore-favicon-updated.png" sizes="512x512">
  <link rel="apple-touch-icon" href="ndoore-favicon-updated.png">

  <!-- FONT AWESOME -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* PAGE */
    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    html {
      overscroll-behavior-y: auto;
    }

    body {
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* MAIN HOME */
    .home {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    /* HEADER */
    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 30px 5%;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      z-index: 10;
    }

    /* MENU BUTTON */
    .menu-button {
      width: 34px;
      height: 34px;
      border: none;
      background: transparent;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      z-index: 12;
    }

    .menu-button span {
      display: block;
      width: 25px;
      height: 1.5px;
      background: #fff;
      transition: transform 0.3s, opacity 0.3s;
    }

    .menu-button.active span:first-child {
      transform: translateY(3.75px) rotate(45deg);
    }

    .menu-button.active span:last-child {
      transform: translateY(-3.75px) rotate(-45deg);
    }

    /* MENU OVERLAY */
    .menu-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
      z-index: 8;
    }

    .menu-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* SLIDING MENU */
    .menu-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: min(340px, 85%);
      height: 100vh;
      height: 100dvh;
      background: #0a0a0a;
      padding: 110px 45px 40px;
      display: flex;
      flex-direction: column;
      gap: 30px;
      transform: translateX(100%);
      transition: transform 0.35s ease;
      z-index: 11;
    }

    .menu-panel.active {
      transform: translateX(0);
    }

    .menu-panel a {
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 2.5px;
      transition: opacity 0.3s;
    }

    .menu-panel a:hover {
      opacity: 0.5;
    }

    .menu-divider {
      width: 100%;
      height: 1px;
      background: #292929;
      margin: 5px 0;
    }

    /* CENTER WORDMARK */
    .hero {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .artist-name {
      font-size: clamp(70px, 17vw, 230px);
      font-weight: 900;
      letter-spacing: -0.08em;
      line-height: 1;
      text-align: center;
      padding-right: 0.08em;
    }

    /* OO FACE */
    .face {
      position: relative;
      display: inline-block;
    }

    .eyes {
      display: inline-block;
      transform-origin: center;
      animation: blink 7s 3s infinite;
    }

    .smile {
      position: absolute;
      left: 37%;
      bottom: -0.12em;
      width: 26%;
      height: 0.08em;
      border-bottom: 0.025em solid white;
      border-radius: 0 0 50% 50%;
      pointer-events: none;
    }

    /* BLINK */
    @keyframes blink {
      0%, 94%, 100% {
        transform: scaleY(1);
      }

      96% {
        transform: scaleY(0.08);
      }

      98% {
        transform: scaleY(1);
      }
    }

    /* FOOTER */
    footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 22px 5% 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      z-index: 2;
    }

    /* SOCIAL ICONS */
    .footer-links {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .icon-row {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: nowrap;
      gap: 25px;
    }

    .icon-row a {
      color: #fff;
      text-decoration: none;
      width: 25px;
      height: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      transition: opacity 0.3s, transform 0.3s;
    }

    .icon-row a:hover {
      opacity: 0.5;
      transform: translateY(-2px);
    }

    /* COPYRIGHT */
    .copyright {
      color: #555;
      font-size: 10px;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    /* MOBILE PORTRAIT */
    @media (max-width: 600px) {
      header {
        padding: 24px 6%;
      }

      .artist-name {
        font-size: 19vw;
      }

      .menu-panel {
        padding: 100px 35px 35px;
        gap: 27px;
      }

      .menu-panel a {
        font-size: 12px;
      }

      footer {
        padding: 18px 5% 20px;
        gap: 13px;
      }

      .icon-row {
        gap: 19px;
      }

      .icon-row a {
        width: 22px;
        height: 22px;
        font-size: 18px;
      }

      .copyright {
        font-size: 9px;
      }
    }

    /* SMALL PHONES */
    @media (max-width: 390px) {
      .icon-row {
        gap: 15px;
      }

      .icon-row a {
        width: 20px;
        height: 20px;
        font-size: 16px;
      }
    }

    /* VERY SMALL PHONES */
    @media (max-width: 340px) {
      .icon-row {
        gap: 12px;
      }

      .icon-row a {
        width: 18px;
        height: 18px;
        font-size: 14px;
      }
    }

    /* DESKTOP + LANDSCAPE PHONE FOOTER */
    @media (min-width: 601px),
           (max-width: 600px) and (orientation: landscape) {

      footer {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        padding: 10px 4%;
        gap: 0;
      }

      .footer-links {
        justify-content: flex-start;
      }

      .icon-row {
        justify-content: flex-start;
        gap: 13px;
      }

      .icon-row a {
        width: 19px;
        height: 19px;
        font-size: 16px;
      }

      .copyright {
        font-size: 8px;
        letter-spacing: 1px;
        margin-top: 0;
        margin-left: auto;
        text-align: right;
        white-space: nowrap;
      }
    }

    /* EXTRA COMPACT LANDSCAPE PHONES */
    @media (max-width: 600px) and (orientation: landscape) {
      footer {
        padding: 7px 4%;
      }

      .icon-row {
        gap: 10px;
      }

      .icon-row a {
        width: 17px;
        height: 17px;
        font-size: 14px;
      }

      .copyright {
        font-size: 7px;
      }
    }

    /* REDUCED MOTION */
    @media (prefers-reduced-motion: reduce) {
      .eyes {
        animation: none;
      }

      .menu-panel,
      .menu-overlay,
      .menu-button span {
        transition: none;
      }
    }
  </style>
</head>

<body>

<main class="home">

  <!-- HEADER -->
  <header>

    <button
      class="menu-button"
      id="menuButton"
      aria-label="Open menu"
      aria-expanded="false"
      aria-controls="menuPanel"
    >
      <span></span>
      <span></span>
    </button>

  </header>

  <!-- MENU OVERLAY -->
  <div class="menu-overlay" id="menuOverlay"></div>

  <!-- SLIDING MENU -->
  <nav class="menu-panel" id="menuPanel" aria-label="Main navigation">

    <a
      href="https://www.bborecords.com"
      target="_blank"
      rel="noopener noreferrer"
    >
      BBO RECORDS
    </a>

    <a
      href="https://youtube.com/@venahuncho"
      target="_blank"
      rel="noopener noreferrer"
    >
      VENA HUNCHO
    </a>

    <a
      href="https://mofarity.com"
      target="_blank"
      rel="noopener noreferrer"
    >
      MOFARITY
    </a>

    <a
      href="https://www.beatstars.com/bbobeats"
      target="_blank"
      rel="noopener noreferrer"
    >
      BBO BEATS
    </a>

    <div class="menu-divider"></div>

    <a href="mailto:contact@ndoore.com">
      CONTACT
    </a>

  </nav>

  <!-- CENTER NDOORE WORDMARK -->
  <section class="hero">

    <h1 class="artist-name">
      ND<span class="face">
        <span class="eyes">OO</span>
        <span class="smile"></span>
      </span>RE
    </h1>

  </section>

  <!-- FOOTER -->
  <footer>

    <!-- SOCIAL ICONS -->
    <div class="footer-links">

      <div class="icon-row">

        <!-- FACEBOOK -->
        <a
          href="https://facebook.com/iamndoore"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Facebook"
        >
          <i class="fa-brands fa-facebook-f"></i>
        </a>

        <!-- INSTAGRAM -->
        <a
          href="https://instagram.com/iamndoore"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Instagram"
        >
          <i class="fa-brands fa-instagram"></i>
        </a>

        <!-- X -->
        <a
          href="https://x.com/iamndoore"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="X"
        >
          <i class="fa-brands fa-x-twitter"></i>
        </a>

        <!-- TIKTOK -->
        <a
          href="https://www.tiktok.com/@iamndoore"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="TikTok"
        >
          <i class="fa-brands fa-tiktok"></i>
        </a>

      </div>

    </div>

    <!-- COPYRIGHT -->
    <div class="copyright">
      © NDOORE
    </div>

  </footer>

</main>

<script>
  const menuButton = document.getElementById("menuButton");
  const menuPanel = document.getElementById("menuPanel");
  const menuOverlay = document.getElementById("menuOverlay");

  function toggleMenu() {
    const isOpen = menuPanel.classList.toggle("active");

    menuButton.classList.toggle("active", isOpen);
    menuOverlay.classList.toggle("active", isOpen);

    menuButton.setAttribute("aria-expanded", isOpen);
    menuButton.setAttribute(
      "aria-label",
      isOpen ? "Close menu" : "Open menu"
    );
  }

  function closeMenu() {
    menuPanel.classList.remove("active");
    menuButton.classList.remove("active");
    menuOverlay.classList.remove("active");

    menuButton.setAttribute("aria-expanded", "false");
    menuButton.setAttribute("aria-label", "Open menu");
  }

  menuButton.addEventListener("click", toggleMenu);
  menuOverlay.addEventListener("click", closeMenu);

  menuPanel.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", closeMenu);
  });

  document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
      closeMenu();
    }
  });
</script>

</body>
</html>
