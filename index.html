
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NDOORE</title>
  <meta name="description" content="The official website of NDOORE. Pre-save and stream NDOORE music on your favourite platforms, connect with NDOORE on social media and book NDOORE for performances.">
  <meta name="theme-color" content="#000000">

  <!-- FAVICON -->
  <link rel="icon" href="ndoore-favicon-updated.ico" sizes="any">
  <link rel="icon" type="image/png" href="ndoore-favicon-updated.png" sizes="512x512">
  <link rel="apple-touch-icon" href="ndoore-favicon-updated.png">

  <!-- Font Awesome Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* PAGE */
    html {
      width: 100%;
      min-height: 100%;
      background: #000;
      overscroll-behavior-y: auto;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* MAIN HOME */
    .home {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    /* HEADER */
    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 30px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .logo {
      color: #fff;
      text-decoration: none;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    nav {
      display: flex;
      gap: 35px;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 3px;
      transition: opacity 0.3s;
    }

    nav a:hover {
      opacity: 0.5;
    }

    /* CENTER WORDMARK */
    .hero {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .artist-name {
      font-size: clamp(70px, 17vw, 230px);
      font-weight: 900;
      letter-spacing: -0.08em;
      line-height: 1;
      text-align: center;
      padding-right: 0.08em;
    }

    /* OO FACE */
    .face {
      position: relative;
      display: inline-block;
    }

    .eyes {
      display: inline-block;
      transform-origin: center;
      animation: blink 7s 3s infinite;
    }

    .smile {
      position: absolute;
      left: 37%;
      bottom: -0.12em;
      width: 26%;
      height: 0.08em;
      border-bottom: 0.025em solid white;
      border-radius: 0 0 50% 50%;
      pointer-events: none;
    }

    /* BLINK */
    @keyframes blink {
      0%, 94%, 100% {
        transform: scaleY(1);
      }

      96% {
        transform: scaleY(0.08);
      }

      98% {
        transform: scaleY(1);
      }
    }

    /* FOOTER */
    footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 22px 5% 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      z-index: 2;
    }

    /* FOOTER GROUPS */
    .footer-links,
    .platform-group {
      display: contents;
    }

    /* ROW LABEL */
    .row-label {
      color: #555;
      font-size: 8px;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: -7px;
    }

    /* ICON ROW */
    .icon-row {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: nowrap;
      gap: 25px;
    }

    .icon-row a {
      color: #fff;
      text-decoration: none;
      width: 25px;
      height: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      transition: opacity 0.3s, transform 0.3s;
    }

    .icon-row a:hover {
      opacity: 0.5;
      transform: translateY(-2px);
    }

    /* BOOMPLAY */
    .boomplay-icon {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 23px;
      font-weight: 900;
      line-height: 1;
    }

    /* YOUTUBE MUSIC */
    .youtube-music-icon {
      position: relative;
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
      border-radius: 50%;
    }

    .youtube-music-icon::after {
      content: "";
      width: 0;
      height: 0;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      border-left: 6px solid #fff;
      margin-left: 2px;
    }

    /* MDUNDO */
    .mdundo-icon {
      font-size: 20px;
    }

    /* AUDIOMACK */
    .audiomack-icon {
      width: 27px;
      height: 23px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
    }

    .audiomack-icon svg {
      display: block;
      width: 27px;
      height: 23px;
      overflow: visible;
    }

    .audiomack-wave {
      fill: none;
      stroke: #fff;
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* COPYRIGHT */
    .copyright {
      color: #555;
      font-size: 10px;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    /* MOBILE PORTRAIT */
    @media (max-width: 600px) {
      header {
        padding: 24px 6%;
      }

      .logo {
        font-size: 20px;
      }

      nav {
        gap: 18px;
      }

      nav a {
        font-size: 10px;
        letter-spacing: 1.5px;
      }

      .artist-name {
        font-size: 19vw;
      }

      footer {
        padding: 18px 5% 20px;
        gap: 13px;
      }

      .icon-row {
        gap: 19px;
      }

      .icon-row a {
        width: 22px;
        height: 22px;
        font-size: 18px;
      }

      .boomplay-icon {
        font-size: 20px;
      }

      .youtube-music-icon {
        width: 20px;
        height: 20px;
      }

      .audiomack-icon {
        width: 23px;
        height: 21px;
      }

      .audiomack-icon svg {
        width: 23px;
        height: 21px;
      }

      .row-label {
        font-size: 7px;
      }

      .copyright {
        font-size: 9px;
      }
    }

    /* SMALL PHONES */
    @media (max-width: 390px) {
      .icon-row {
        gap: 15px;
      }

      .icon-row a {
        width: 20px;
        height: 20px;
        font-size: 16px;
      }

      .boomplay-icon {
        font-size: 18px;
      }

      .youtube-music-icon {
        width: 18px;
        height: 18px;
        border-width: 1.5px;
      }

      nav {
        gap: 14px;
      }

      nav a {
        font-size: 9px;
      }
    }

    /* VERY SMALL PHONES */
    @media (max-width: 340px) {
      .icon-row {
        gap: 12px;
      }

      .icon-row a {
        width: 18px;
        height: 18px;
        font-size: 14px;
      }

      .boomplay-icon {
        font-size: 16px;
      }
    }

    /* DESKTOP + LANDSCAPE PHONE FOOTER */
    @media (min-width: 601px),
           (max-width: 600px) and (orientation: landscape) {

      footer {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        padding: 10px 4%;
        gap: 0;
      }

      /* MUSIC + SOCIAL ON LEFT */
      .footer-links {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 7px;
      }

      .platform-group {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 12px;
      }

      /* SMALL LABELS */
      .row-label {
        width: 42px;
        flex-shrink: 0;
        text-align: left;
        font-size: 7px;
        letter-spacing: 1.5px;
        margin-bottom: 0;
      }

      /* SMALLER ICON ROWS */
      .icon-row {
        justify-content: flex-start;
        gap: 13px;
      }

      .icon-row a {
        width: 19px;
        height: 19px;
        font-size: 16px;
      }

      .boomplay-icon {
        font-size: 17px;
      }

      .youtube-music-icon {
        width: 17px;
        height: 17px;
        border-width: 1.5px;
      }

      .audiomack-icon {
        width: 19px;
        height: 19px;
      }

      .audiomack-icon svg {
        width: 19px;
        height: 19px;
      }

      .mdundo-icon {
        font-size: 16px;
      }

      /* COPYRIGHT ON RIGHT */
      .copyright {
        font-size: 8px;
        letter-spacing: 1px;
        margin-top: 0;
        margin-left: auto;
        text-align: right;
        align-self: center;
        white-space: nowrap;
      }
    }

    /* EXTRA COMPACT LANDSCAPE PHONES */
    @media (max-width: 600px) and (orientation: landscape) {
      footer {
        padding: 7px 4%;
      }

      .footer-links {
        gap: 5px;
      }

      .platform-group {
        gap: 8px;
      }

      .row-label {
        width: 35px;
        font-size: 6px;
        letter-spacing: 1px;
      }

      .icon-row {
        gap: 10px;
      }

      .icon-row a {
        width: 17px;
        height: 17px;
        font-size: 14px;
      }

      .boomplay-icon {
        font-size: 15px;
      }

      .youtube-music-icon {
        width: 15px;
        height: 15px;
      }

      .audiomack-icon {
        width: 17px;
        height: 17px;
      }

      .audiomack-icon svg {
        width: 17px;
        height: 17px;
      }

      .copyright {
        font-size: 7px;
      }
    }

    /* REDUCED MOTION */
    @media (prefers-reduced-motion: reduce) {
      .eyes {
        animation: none;
      }
    }
  </style>
</head>

<body>

<main class="home">

  <!-- HEADER -->
  <header>

    <a class="logo" href="#">

    </a>

    <nav>

      <!-- PRE-SAVE -->
      <a

          <!-- AUDIOMACK -->
          <a
            href="https://audiomack.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Audiomack"
          >
            <span class="audiomack-icon">
              <svg
                viewBox="0 0 27 23"

      </div>

      <!-- SOCIAL -->
      <div class="platform-group">

        <div class="icon-row">

    <!-- RIGHT SIDE: COPYRIGHT -->

    </div>

  </footer>

</body>
</html>
