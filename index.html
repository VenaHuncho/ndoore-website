<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NDOORE</title>
  <meta name="description" content="NDOORE — Official website.">
  <meta name="theme-color" content="#000000">

  <!-- Font Awesome for social icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow: hidden;
    }

    .home {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 30px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    nav {
      display: flex;
      gap: 35px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 3px;
      transition: opacity 0.3s;
    }

    nav a:hover {
      opacity: 0.5;
    }


    /* =========================
       CENTER WORDMARK
    ========================= */

    .hero {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .artist-name {
      font-size: clamp(70px, 17vw, 230px);
      font-weight: 900;
      letter-spacing: -0.08em;
      line-height: 1;
      text-align: center;
      padding-right: 0.08em;
    }


    /* =========================
       OO FACE
    ========================= */

    .face {
      position: relative;
      display: inline-block;
    }

    .eyes {
      display: inline-block;
      transform-origin: center;
      animation: blink 7s 3s infinite;
    }

    /* Permanent subtle smile */

    .smile {
      position: absolute;
      left: 37%;
      bottom: -0.12em;
      width: 26%;
      height: 0.08em;
      border-bottom: 0.025em solid white;
      border-radius: 0 0 50% 50%;
      pointer-events: none;
    }

    /* Blink */

    @keyframes blink {
      0%, 94%, 100% {
        transform: scaleY(1);
      }

      96% {
        transform: scaleY(0.08);
      }

      98% {
        transform: scaleY(1);
      }
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 25px 5%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      z-index: 2;
    }

    /* SOCIAL ICONS */

    .socials {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }

    .socials a {
      color: white;
      text-decoration: none;
      font-size: 25px;
      transition:
        opacity 0.3s,
        transform 0.3s;
    }

    .socials a:hover {
      opacity: 0.55;
      transform: translateY(-2px);
    }

    /* COPYRIGHT */

    .copyright {
      color: #aaa;
      font-size: 11px;
      letter-spacing: 1px;
      text-align: center;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      header {
        padding: 24px 6%;
      }

      .logo {
        font-size: 20px;
      }

      nav {
        gap: 18px;
      }

      nav a {
        font-size: 10px;
        letter-spacing: 1.5px;
      }

      .artist-name {
        font-size: 19vw;
      }

      footer {
        padding: 20px 6%;
        gap: 17px;
      }

      .socials {
        gap: 22px;
      }

      .socials a {
        font-size: 22px;
      }

      .copyright {
        font-size: 9px;
      }
    }


    /* =========================
       VERY SMALL PHONES
    ========================= */

    @media (max-width: 380px) {

      .socials {
        gap: 17px;
      }

      .socials a {
        font-size: 20px;
      }

      nav {
        gap: 14px;
      }

      nav a {
        font-size: 9px;
      }
    }


    /* =========================
       REDUCED MOTION
    ========================= */

    @media (prefers-reduced-motion: reduce) {
      .eyes {
        animation: none;
      }
    }
  </style>
</head>


<body>

<main class="home">


  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <a class="logo" href="#">NDOORE</a>

    <nav>

      <!-- CHANGE YOUR PRE-SAVE LINK HERE -->
      <a
        href="https://YOUR-PRE-SAVE-LINK-HERE.com"
        target="_blank"
        rel="noopener noreferrer"
      >
        PRE-SAVE
      </a>

      <!-- BOOKING EMAIL -->
      <a href="mailto:book@ndoore.com">
        BOOK
      </a>

    </nav>

  </header>



  <!-- =========================
       CENTER WORDMARK
  ========================= -->

  <section class="hero">

    <h1 class="artist-name">

      ND<span class="face">
        <span class="eyes">OO</span>
        <span class="smile"></span>
      </span>RE

    </h1>

  </section>



  <!-- =========================
       FOOTER
  ========================= -->

  <footer>

    <div class="socials">

      <!-- INSTAGRAM -->
      <a
        href="https://instagram.com/iamndoore"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram"
      >
        <i class="fa-brands fa-instagram"></i>
      </a>


      <!-- X -->
      <a
        href="https://x.com/iamndoore"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="X"
      >
        <i class="fa-brands fa-x-twitter"></i>
      </a>


      <!-- YOUTUBE -->
      <a
        href="https://youtube.com/@ndoore"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="YouTube"
      >
        <i class="fa-brands fa-youtube"></i>
      </a>


      <!-- SPOTIFY -->
      <a
        href="https://open.spotify.com/artist/YOUR-SPOTIFY-ID"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Spotify"
      >
        <i class="fa-brands fa-spotify"></i>
      </a>


      <!-- APPLE MUSIC -->
      <a
        href="https://music.apple.com/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Apple Music"
      >
        <i class="fa-brands fa-apple"></i>
      </a>


      <!-- SOUNDCLOUD -->
      <a
        href="https://soundcloud.com/YOUR-SOUNDCLOUD"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="SoundCloud"
      >
        <i class="fa-brands fa-soundcloud"></i>
      </a>


      <!-- TIKTOK -->
      <a
        href="https://www.tiktok.com/@iamndoore"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="TikTok"
      >
        <i class="fa-brands fa-tiktok"></i>
      </a>

    </div>


    <!-- COPYRIGHT ONLY -->
    <div class="copyright">
      © NDOORE
    </div>

  </footer>

</main>

</body>
</html>
