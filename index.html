<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NDOORE</title>
  <meta name="description" content="NDOORE — Official website.">
  <meta name="theme-color" content="#000000">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow: hidden;
    }

    .home {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 70% 45%, #292929 0%, transparent 48%),
        linear-gradient(135deg, #080808, #151515 55%, #000);
    }

    /* Header */
    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 30px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 2px;
      color: white;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 35px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 3px;
      transition: opacity 0.3s;
    }

    nav a:hover {
      opacity: 0.5;
    }

    /* Main artist name */
    .hero {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .artist-name {
      font-size: clamp(70px, 17vw, 230px);
      font-weight: 900;
      letter-spacing: -0.08em;
      line-height: 1;
      text-align: center;
      padding-right: 0.08em;
    }

    /* Footer */
    footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 25px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    footer a {
      color: #aaa;
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 1px;
    }

    footer a:hover {
      color: white;
    }

    .socials {
      display: flex;
      gap: 20px;
    }

    .copyright {
      color: #666;
      font-size: 11px;
    }

    /* Mobile */
    @media (max-width: 600px) {
      header {
        padding: 24px 6%;
      }

      .logo {
        font-size: 20px;
      }

      nav {
        gap: 18px;
      }

      nav a {
        font-size: 10px;
        letter-spacing: 1.5px;
      }

      .artist-name {
        font-size: 19vw;
      }

      footer {
        padding: 20px 6%;
      }

      .socials {
        gap: 14px;
      }

      .copyright {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>
  <main class="home">

    <header>
      <a class="logo" href="#">NDOORE</a>

      <nav>
        <a href="#">MUSIC</a>
        <a href="#">VIDEOS</a>
      </nav>
    </header>

    <section class="hero">
      <h1 class="artist-name">NDOORE</h1>
    </section>

    <footer>
      <div class="socials">
        <a href="#" target="_blank">INSTAGRAM</a>
        <a href="#" target="_blank">YOUTUBE</a>
      </div>

      <div class="copyright">
        © NDOORE
      </div>
    </footer>

  </main>
</body>
</html>
