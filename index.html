<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NDOORE</title>
  <meta name="description" content="NDOORE — Official website.">
  <meta name="theme-color" content="#000000">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow: hidden;
    }

    .home {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    /* HEADER */
    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 30px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    nav {
      display: flex;
      gap: 35px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 3px;
      transition: opacity 0.3s;
    }

    nav a:hover {
      opacity: 0.5;
    }

    /* CENTER WORDMARK */
    .hero {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .artist-name {
      font-size: clamp(70px, 17vw, 230px);
      font-weight: 900;
      letter-spacing: -0.08em;
      line-height: 1;
      text-align: center;
      padding-right: 0.08em;
    }

    /* OO FACE */
    .face {
      position: relative;
      display: inline-block;
    }

    /* EYES */
    .eyes {
      display: inline-block;
      transform-origin: center;
      animation: blink 7s 3s infinite;
    }

    /* PERMANENT SUBTLE SMILE */
    .smile {
      position: absolute;
      left: 37%;
      bottom: -0.12em;
      width: 26%;
      height: 0.08em;
      border-bottom: 0.025em solid white;
      border-radius: 0 0 50% 50%;
      pointer-events: none;
    }

    /* BLINK */
    @keyframes blink {
      0%, 94%, 100% {
        transform: scaleY(1);
      }

      96% {
        transform: scaleY(0.08);
      }

      98% {
        transform: scaleY(1);
      }
    }

    /* FOOTER */
    footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 25px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    footer a {
      color: #aaa;
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 1px;
      transition: color 0.3s;
    }

    footer a:hover {
      color: white;
    }

    .socials {
      display: flex;
      gap: 20px;
    }

    .copyright {
      color: #666;
      font-size: 11px;
    }

    /* MOBILE */
    @media (max-width: 600px) {
      header {
        padding: 24px 6%;
      }

      .logo {
        font-size: 20px;
      }

      nav {
        gap: 18px;
      }

      nav a {
        font-size: 10px;
        letter-spacing: 1.5px;
      }

      .artist-name {
        font-size: 19vw;
      }

      footer {
        padding: 20px 6%;
      }

      .socials {
        gap: 14px;
      }

      .copyright {
        font-size: 9px;
      }
    }

    /* REDUCED MOTION ACCESSIBILITY */
    @media (prefers-reduced-motion: reduce) {
      .eyes {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="home">

    <header>
      <a class="logo" href="#">NDOORE</a>

      <nav>
        <a href="#">MUSIC</a>
        <a href="#">VIDEOS</a>
      </nav>
    </header>

    <section class="hero">
      <h1 class="artist-name">
        ND<span class="face"><span class="eyes">OO</span><span class="smile"></span></span>RE
      </h1>
    </section>

    <footer>
      <div class="socials">
        <a href="#" target="_blank">INSTAGRAM</a>
        <a href="#" target="_blank">YOUTUBE</a>
      </div>

      <div class="copyright">
        © NDOORE
      </div>
    </footer>

  </main>
</body>
</html>
