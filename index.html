<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NDOORE</title>
  <meta name="description" content="NDOORE — Official website.">
  <meta name="theme-color" content="#000000">

  <!-- Font Awesome Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow: hidden;
    }

    .home {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }


    /* =========================
       HEADER
    ========================= */

    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 30px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    nav {
      display: flex;
      gap: 35px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 3px;
      transition: opacity 0.3s;
    }

    nav a:hover {
      opacity: 0.5;
    }


    /* =========================
       CENTER WORDMARK
    ========================= */

    .hero {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .artist-name {
      font-size: clamp(70px, 17vw, 230px);
      font-weight: 900;
      letter-spacing: -0.08em;
      line-height: 1;
      text-align: center;
      padding-right: 0.08em;
    }


    /* =========================
       OO FACE
    ========================= */

    .face {
      position: relative;
      display: inline-block;
    }

    .eyes {
      display: inline-block;
      transform-origin: center;
      animation: blink 7s 3s infinite;
    }

    .smile {
      position: absolute;
      left: 37%;
      bottom: -0.12em;
      width: 26%;
      height: 0.08em;
      border-bottom: 0.025em solid white;
      border-radius: 0 0 50% 50%;
      pointer-events: none;
    }


    /* =========================
       BLINK
    ========================= */

    @keyframes blink {
      0%, 94%, 100% {
        transform: scaleY(1);
      }

      96% {
        transform: scaleY(0.08);
      }

      98% {
        transform: scaleY(1);
      }
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 22px 5% 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      z-index: 2;
    }


    /* =========================
       ICON ROWS
    ========================= */

    .icon-row {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: nowrap;
      gap: 25px;
    }

    .icon-row a {
      color: white;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      transition:
        opacity 0.3s,
        transform 0.3s;
    }

    .icon-row a:hover {
      opacity: 0.5;
      transform: translateY(-2px);
    }


    /* MUSIC + SOCIAL LABELS */

    .row-label {
      color: #555;
      font-size: 8px;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: -7px;
    }


    /* =========================
       COPYRIGHT
    ========================= */

    .copyright {
      color: #555;
      font-size: 10px;
      letter-spacing: 1px;
      margin-top: 2px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      header {
        padding: 24px 6%;
      }

      .logo {
        font-size: 20px;
      }

      nav {
        gap: 18px;
      }

      nav a {
        font-size: 10px;
        letter-spacing: 1.5px;
      }

      .artist-name {
        font-size: 19vw;
      }

      footer {
        padding: 18px 5% 20px;
        gap: 13px;
      }

      .icon-row {
        gap: 19px;
      }

      .icon-row a {
        font-size: 18px;
      }

      .row-label {
        font-size: 7px;
      }

      .copyright {
        font-size: 9px;
      }
    }


    /* =========================
       SMALL PHONES
    ========================= */

    @media (max-width: 390px) {

      .icon-row {
        gap: 15px;
      }

      .icon-row a {
        font-size: 16px;
      }

      nav {
        gap: 14px;
      }

      nav a {
        font-size: 9px;
      }
    }


    /* =========================
       VERY SMALL PHONES
    ========================= */

    @media (max-width: 340px) {

      .icon-row {
        gap: 12px;
      }

      .icon-row a {
        font-size: 14px;
      }
    }


    /* =========================
       REDUCED MOTION
    ========================= */

    @media (prefers-reduced-motion: reduce) {
      .eyes {
        animation: none;
      }
    }

  </style>
</head>
